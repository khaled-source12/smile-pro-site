[build]
  command = "npm run check"
  publish = "dist"
  functions = "netlify/functions"

# Every deploy may replace HTML, CMS fragments and stable public URLs.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# This directory is generated at build time and contains content hashes only.
[[headers]]
  for = "/assets/generated/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Legacy Arabic URLs that selected English with ?lang=en.
# A replacement query prevents Netlify from forwarding lang=en; site.js removes
# redirected=1 from the address bar without deciding which content is served.
[[redirects]]
  from = "/ar/"
  to = "/?redirected=1"
  query = { lang = "en" }
  status = 301
  force = true

[[redirects]]
  from = "/ar/index.html"
  to = "/?redirected=1"
  query = { lang = "en" }
  status = 301
  force = true

[[redirects]]
  from = "/blog/"
  to = "/en/blog/?redirected=1"
  query = { lang = "en" }
  status = 301
  force = true

